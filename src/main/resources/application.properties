spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vehicle_telematics}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:telematics}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:telematics}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Cookie-backed HTTP session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m

# Initial administrator. Override these values outside local development.
app.initial-admin.enabled=${INITIAL_ADMIN_ENABLED:true}
app.initial-admin.email=${INITIAL_ADMIN_EMAIL:admin@example.com}
app.initial-admin.first-name=${INITIAL_ADMIN_FIRST_NAME:System}
app.initial-admin.last-name=${INITIAL_ADMIN_LAST_NAME:Administrator}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD:change-me}

# MQTT broker
app.mqtt.enabled=${MQTT_ENABLED:true}
app.mqtt.server-uri=${MQTT_SERVER_URI:ssl://localhost:8883}
app.mqtt.client-id=${MQTT_CLIENT_ID:vehicle-telematics-backend}
app.mqtt.ca-certificate=${MQTT_CA_CERTIFICATE:}
app.mqtt.client-certificate=${MQTT_CLIENT_CERTIFICATE:}
app.mqtt.client-private-key=${MQTT_CLIENT_PRIVATE_KEY:}
app.mqtt.connection-timeout-seconds=${MQTT_CONNECTION_TIMEOUT_SECONDS:10}
app.mqtt.keep-alive-seconds=${MQTT_KEEP_ALIVE_SECONDS:30}

# Reverse geocoding
app.geocoding.nominatim.base-url=${NOMINATIM_BASE_URL:http://localhost:8088}
app.geocoding.nominatim.connect-timeout=${NOMINATIM_CONNECT_TIMEOUT:2s}
app.geocoding.nominatim.read-timeout=${NOMINATIM_READ_TIMEOUT:3s}
app.geocoding.nominatim.accept-language=${NOMINATIM_ACCEPT_LANGUAGE:sr-Latn,sr,en;q=0.8}
