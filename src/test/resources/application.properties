spring.datasource.url=jdbc:h2:mem:vehicle_telematics;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.initial-admin.enabled=true
app.initial-admin.email=admin@example.com
app.initial-admin.first-name=System
app.initial-admin.last-name=Administrator
app.initial-admin.password=test-password
